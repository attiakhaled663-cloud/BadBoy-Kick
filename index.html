<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BadBoy Kick — تحت الصيانة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root{
        --bg:#0a0f08; --fg:#e8ffe0; --muted:#5a7a5a;
        --accent:#53fc18; --accent2:#9dff6b;
        --card:rgba(6,10,6,0.95); --border:rgba(83,252,24,.35);
        --danger:#ff3b3b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
        background:var(--bg); color:var(--fg);
        font-family:'Tajawal',sans-serif;
        min-height:100vh; overflow:hidden;
        display:flex; align-items:center; justify-content:center;
        padding:20px;
        position:relative;
    }
    .bg-glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(120px);z-index:0;}
    .bg-glow.g1{width:500px;height:500px;top:-150px;left:-100px;background:rgba(83,252,24,.10);animation:gd1 14s ease-in-out infinite;}
    .bg-glow.g2{width:400px;height:400px;bottom:-100px;right:-80px;background:rgba(255,255,255,0.05);animation:gd2 18s ease-in-out infinite;}
    @keyframes gd1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
    @keyframes gd2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-30px)}}

    .card{
        position:relative; z-index:2;
        background:var(--card); border:1px solid var(--border);
        border-radius:24px; padding:40px 28px;
        max-width:400px; width:100%; text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,.6);
    }
    .icon-wrap{
        width:88px; height:88px; margin:0 auto 22px; position:relative;
        display:flex; align-items:center; justify-content:center;
        border-radius:50%;
        background:radial-gradient(circle,rgba(83,252,24,.15) 0%, transparent 70%);
    }
    .icon-wrap i{
        font-size:40px;
        background:linear-gradient(135deg,#53fc18 0%,#9dff6b 50%,#53fc18 100%);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        animation:spin 3s linear infinite;
    }
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    .brand{
        font-size:22px; font-weight:900; letter-spacing:-.5px; margin-bottom:6px;
        background:linear-gradient(135deg,#53fc18 0%,#9dff6b 50%,#53fc18 100%);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    h1{
        font-size:20px; font-weight:900; margin-bottom:12px; color:var(--fg);
    }
    p{
        font-size:14px; line-height:1.8; color:var(--muted); margin-bottom:26px;
    }
    .bar{
        width:100%; height:4px; background:rgba(83,252,24,.08); border-radius:2px;
        margin-bottom:28px; overflow:hidden;
    }
    .bar-fill{
        height:100%; width:60%;
        background:linear-gradient(90deg,#53fc18,#9dff6b,#53fc18);
        background-size:200% 100%; border-radius:2px;
        animation:shimmer 1.5s linear infinite;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    .btn-close{
        width:100%; padding:14px; border-radius:14px; cursor:pointer;
        background:var(--danger); color:#fff; border:2px solid #fff;
        font-weight:700; font-size:15px; font-family:inherit;
        display:flex; align-items:center; justify-content:center; gap:8px;
        transition:all .2s;
    }
    .btn-close:hover{ transform:scale(1.02); box-shadow:0 6px 20px rgba(255,59,59,.35); }
    .btn-close:active{ transform:scale(.97); }

    .note{ margin-top:16px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>

    <div class="card">
        <div class="icon-wrap"><i class="fas fa-gear"></i></div>
        <div class="brand">BadBoy Kick</div>
        <h1>التطبيق مغلق مؤقتًا للصيانة</h1>
        <p>هعكل في الحمايه بتاعت التطبيق وارجع اشغله</p>
        <div class="bar"><div class="bar-fill"></div></div>
        <button class="btn-close" onclick="closeApp()">
            <i class="fas fa-power-off"></i>
            إغلاق التطبيق
        </button>
        <div class="note">التطبيق هيرجع يشتغل في غضون اقل من يومين بإذن الله</div>
    </div>

<script>
function closeApp(){
    try{
        window.close();
    }catch(e){}
    // fallback إذا لم يُغلق التبويب (بعض المتصفحات تمنع الإغلاق البرمجي)
    setTimeout(function(){
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#5a7a5a;font-family:Tajawal,sans-serif;font-size:14px;text-align:center;padding:20px;">تم إنهاء الجلسة. يمكنك إغلاق هذه النافذة الآن.</div>';
    }, 300);
}
</script>
</body>
</html>
