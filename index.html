<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BadBoy Kick - التحديث الجديد</title>
<link rel="icon" type="image/png" href="./RedKick_files/ab46995c-be54-4f0c-97d9-dc9965e3150b.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0f08; --fg:#e8ffe0; --muted:#6f9a6f;
    --accent:#53fc18; --accent2:#9dff6b;
    --card:rgba(6,10,6,.92); --border:rgba(83,252,24,.35);
    --danger:#ff3b3b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:'Tajawal',Tahoma,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; overflow-x:hidden;
    background-image:radial-gradient(ellipse at center,#0d2a0a 0%,#0a0f08 70%);
  }
  .glow { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; }
  .g1 { width:420px; height:420px; top:-140px; left:-100px; background:rgba(83,252,24,.10); animation:float1 14s ease-in-out infinite; }
  .g2 { width:340px; height:340px; bottom:-100px; right:-80px; background:rgba(255,255,255,.05); animation:float2 18s ease-in-out infinite; }
  @keyframes float1 { 50% { transform:translate(30px,20px); } }
  @keyframes float2 { 50% { transform:translate(-20px,-30px); } }

  .card {
    position:relative; z-index:1; width:100%; max-width:420px;
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:34px 24px 28px; text-align:center;
    box-shadow:0 0 40px rgba(83,252,24,.12), inset 0 0 30px rgba(83,252,24,.04);
    backdrop-filter:blur(10px);
  }
  .logo-wrap {
    width:96px; height:96px; margin:0 auto 14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--border);
    animation:pulse 2.4s ease-in-out infinite;
  }
  .logo-wrap img { width:60px; height:60px; object-fit:contain; }
  .logo-wrap i { font-size:40px; color:var(--accent); }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 12px rgba(83,252,24,.25); }
    50% { box-shadow:0 0 30px rgba(83,252,24,.65); }
  }
  h1 {
    font-size:34px; font-weight:900; margin-bottom:6px;
    background:linear-gradient(135deg,#53fc18,#9dff6b,#53fc18);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:var(--muted); font-size:14px; margin-bottom:26px; }

  .promo {
    font-size:17px; font-weight:700; line-height:1.8; margin-bottom:14px;
    color:var(--fg);
  }
  .promo i { color:var(--accent); margin-inline-start:6px; }

  .btn {
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 18px; border-radius:14px; font-family:inherit; font-size:18px; font-weight:900;
    cursor:pointer; border:none; transition:transform .15s, box-shadow .2s, opacity .2s;
  }
  .btn:active { transform:scale(.97); }
  .btn-primary {
    background:linear-gradient(135deg,#53fc18,#9dff6b); color:#07120300;
    color:#06110a; box-shadow:0 0 22px rgba(83,252,24,.45);
  }
  .btn-primary:hover { box-shadow:0 0 34px rgba(83,252,24,.75); }
  .btn-secondary {
    margin-top:14px; background:transparent; color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .btn-secondary:hover { background:rgba(83,252,24,.1); }

  #status {
    min-height:24px; margin-top:16px; font-size:14px; font-weight:700;
    opacity:0; transition:opacity .25s;
  }
  #status.show { opacity:1; }
  #status.ok { color:var(--accent); }
  #status.err { color:var(--danger); }
  .hint { margin-top:6px; font-size:12px; color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<main class="card">
  <div class="logo-wrap">
    <img src="./RedKick_files/ab46995c-be54-4f0c-97d9-dc9965e3150b.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa-solid fa-bolt'}))">
  </div>
  <h1>BadBoy Kick</h1>
  <p class="sub">إصدار جديد جاهز للتحميل</p>

  <p class="promo"><i class="fa-solid fa-sparkles"></i>نزل التحديث الجديد واستمتع بالميزات</p>

  <button class="btn btn-primary" id="updateBtn">
    <i class="fa-solid fa-download"></i> تحميل التحديث الجديد
  </button>

  <button class="btn btn-secondary" id="copyBtn">
    <i class="fa-solid fa-copy"></i> نسخ البيانات قبل المغادرة
  </button>

  <div id="status" role="status"></div>
  <p class="hint">انسخ بياناتك أولاً ثم الصقها في مكان آمن قبل التحديث. البيانات تحتوي على التوكنات فلا تشاركها مع أي أحد.</p>
</main>

<script>
  // ضع هنا رابط التحديث الجديد
  const UPDATE_URL = "https://www.mediafire.com/file/hes37ngv258m0un/BadBoy+Kick.apk/file";

  const statusEl = document.getElementById('status');
  function showStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = 'show ' + (ok ? 'ok' : 'err');
    clearTimeout(showStatus.t);
    showStatus.t = setTimeout(() => statusEl.className = '', 5000);
  }

  document.getElementById('updateBtn').addEventListener('click', () => {
    if (!UPDATE_URL) { showStatus('لم يتم تحديد رابط التحديث بعد', false); return; }
    window.location.href = UPDATE_URL;
  });

  function collectData() {
    const data = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        data[k] = localStorage.getItem(k);
      }
    } catch (e) { return null; }
    return data;
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    }
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const data = collectData();
    if (data === null) { showStatus('تعذر الوصول إلى بيانات المتصفح', false); return; }
    if (Object.keys(data).length === 0) {
      showStatus('لا توجد بيانات محفوظة على هذا الجهاز', false);
      return;
    }
    const payload = JSON.stringify({ exportedAt: new Date().toISOString(), data }, null, 2);
    const ok = await copyText(payload);
    showStatus(ok ? 'تم نسخ البيانات بنجاح ✓' : 'فشل النسخ، حاول مرة أخرى', ok);
  });
</script>
</body>
</html>
